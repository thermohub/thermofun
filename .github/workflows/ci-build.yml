name: ci-build
on:
  push:
    branches:
      - no_aqueous_phase
      - master
      - main
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - os: ubuntu-latest
            conda_platform: linux-64
          - os: windows-latest
            conda_platform: win-64
          - os: macos-latest
            conda_platform: osx-arm64

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          activate-environment: base
          channels: conda-forge

      - name: Configuring Conda Environment
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda config --add channels conda-forge
          conda install conda-devenv
          conda run -n base python -m conda_devenv

      - name: Building, Testing & Installing thermofun
        if: matrix.os != 'windows-latest'
        shell: bash -l {0}
        run: |
          conda activate thermofun
          mkdir .build && cd .build
          cmake -GNinja .. -DCMAKE_BUILD_TYPE=Release -DTFUN_BUILD_TESTS=ON
          ninja
          ninja install
          python -c "import thermofun"

      - name: Running C++ tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash -l {0}
        run: |
          conda activate thermofun
          ctest --test-dir .build --output-on-failure

      # Only the installed-headers test runs on macOS and Windows; the other tests run on Linux
      - name: Running C++ tests (macOS, installed headers only)
        if: matrix.os == 'macos-latest'
        shell: bash -l {0}
        run: |
          conda activate thermofun
          ctest --test-dir .build --output-on-failure -R installed-headers

      - name: Running tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash -l {0}
        run: |
          conda activate thermofun
          pytest -ra -vv --color=yes .

      - name: Building, Testing & Installing thermofun (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call conda activate thermofun || goto :eof
          cmake -DCMAKE_BUILD_TYPE=Release -DTFUN_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX:PATH="%CONDA_PREFIX%\Library" -A x64 -S . -B build  || goto :eof
          cmake --build build --target install --config Release || goto :eof
          ctest --test-dir build -C Release -R installed-headers --output-on-failure || goto :eof
          python -c "import thermofun" || goto :eof

      - name: Run tests that read thermofun
        shell: bash -l {0}
        run: |
          conda activate thermofun
          python -c "import thermofun"
          conda list

      - name: Check conda
        run: |
          conda config --show
          conda list --show-channel-urls

