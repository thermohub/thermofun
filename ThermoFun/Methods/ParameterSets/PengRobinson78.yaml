thermohub: 2.0.0-draft.1
parameter_sets:
  PengRobinson78_constants_v1:
    method: PengRobinson78
    formula_units: {none: numbers}
    description: "Peng-Robinson equation of state, 1978 form. a = Oa R2 Tc2/Pc alpha, b = Ob R Tc/Pc, alpha = (1 + k (1 - sqrt(T/Tc)))2. k = k1_0 + k1_1 w - k1_2 w2 for omega w up to omega_switch, else k = k2_0 + k2_1 w - k2_2 w2 + k2_3 w3. All are numbers without units."
    reference: "Peng D.Y., Robinson D.B. (1976) Ind. Eng. Chem. Fundam. 15, 59-64; Robinson D.B., Peng D.Y. (1978) GPA Research Report 28"
    parameters:
      k1_0: 0.37464
      k1_1: 1.54226
      k1_2: 0.26992
      k2_0: 0.379642
      k2_1: 1.48503
      k2_2: 0.164423
      k2_3: 0.0166666
      omega_switch: 0.491
      Oa: 0.457235529
      Ob: 0.0777960739
