thermohub: 2.0.0-draft.1
parameter_sets:
  HKF88_reaktoro_constants_v1:
    method: HKF88
    implementation: reaktoro
    description: "Universal constants of the HKF equation of state of aqueous species and of its g function, Reaktoro digits. eta in A cal/mol; theta in K; psi and Pr in bar; Tr in K; zeta in A; Zr, Yr: Born functions at Tr, Pr; ag, bg: g function in the units of the paper; af: g function in the shaded region. Dmax in g/cm3: above this density of water the model warns that it is out of its range. The two implementations have different digits of these numbers, both kept to reproduce each code."
    reference: "Tanger and Helgeson (1988); Shock et al. (1992)"
    parameters:
      eta: 1.66027e+05
      theta: 228.0
      psi: 2600.0
      Tr: 298.15
      Pr: 1.0
      Zr: -1.278055636e-02
      Yr: -5.795424563e-05
      zeta: 3.082
      gr: 0.0
      ag1: -2.037662
      ag2: 5.747000e-03
      ag3: -6.557892e-06
      bg1: 6.107361
      bg2: -1.074377e-02
      bg3: 1.268348e-05
      af1: 3.666660e+01
      af2: -1.504956e-10
      af3: 5.017990e-14
      Dmax: 1.4
  HKF88_gems_constants_v1:
    method: HKF88
    implementation: gems
