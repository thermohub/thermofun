    reference: "Tanger and Helgeson (1988); Shock et al. (1992)"
    parameters:
      eta: 0.166027e6
      theta: 0.228e3
      psi: 0.26e4
      Tr: 0.29815e3
      Pr: 0.1e1
      Zr: -0.1278034682e-1
      Yr: -0.5798650444e-4
      zeta: 3.082
      gr: 0.0
      ag1: -0.2037662e+01
      ag2: 0.5747000e-02
      ag3: -0.6557892e-05
      bg1: 0.6107361e+01
      bg2: -0.1074377e-01
      bg3: 0.1268348e-04
