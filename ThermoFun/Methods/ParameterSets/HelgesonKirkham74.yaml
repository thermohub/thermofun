thermohub: 2.0.0-draft.1
parameter_sets:
  HelgesonKirkham74_constants_v1:
    method: HelgesonKirkham74
    formula_units: {T: K, rho: g/cm3}
    description: "Dielectric constant of water, from which the HKF coefficients of Tanger and Helgeson (1988) were fitted: eps = sum over i, j of e_i_j T^i rho^j, with T in K and rho in g/cm3. The paper prints the first row of Table E-1 as e(0,1) to e(0,5): these are e_0_0 to e_0_4 of eq. E-1, which gives eps = 78.46 at 298.15 K. Tanger and Helgeson used the equations of Bradley and Pitzer (1979), the method BradleyPitzer79, at low T above 1 kbar; this method does not switch to it."
    reference: "Helgeson H.C., Kirkham D.H. (1974) Am. J. Sci. 274, 1089-1198; Tanger J.C., Helgeson H.C. (1988) Am. J. Sci. 288, 19-98, Appendix E"
    parameters:
      e_0_0: 4.39109592e2
      e_0_1: -2.18995148e2
      e_0_2: 1.82898246e1
      e_0_3: 1.54886800e2
      e_0_4: -6.13542375e1
      e_1_0: -2.33277456
      e_1_1: 1.00498361
      e_1_2: -2.08896146e-1
      e_1_3: -6.13941874e-2
      e_2_0: 4.61662109e-3
      e_2_1: -1.35650709e-3
