thermohub: 2.0.0-draft.1
parameter_sets:
  PRSV86_constants_v1:
    method: PRSV86
    formula_units: {none: numbers}
    description: "Peng-Robinson-Stryjek-Vera equation of state. a = Oa R2 Tc2/Pc alpha, b = Ob R Tc/Pc, alpha = (1 + k (1 - sqrt(T/Tc)))2, k0 = k0_0 + k0_1 w - k0_2 w2 + k0_3 w3 with the omega w. k1, k2, k3 belong to each record. All are numbers without units."
    reference: "Stryjek R., Vera J.H. (1986) Can. J. Chem. Eng. 64, 323-333"
    parameters:
      k0_0: 0.378893
      k0_1: 1.4897153
      k0_2: 0.17131848
      k0_3: 0.0196554
      Oa: 0.457235
      Ob: 0.077796
