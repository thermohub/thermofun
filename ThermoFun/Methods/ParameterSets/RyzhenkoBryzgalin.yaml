thermohub: 2.0.0-draft.1
parameter_sets:
  RyzhenkoBryzgalin_constants_v1:
    method: RyzhenkoBryzgalin
    formula_units: {T: K, rho: g/cm3}
    description: "Log K of a complex from an electrostatic model, as a function of the ionization of water. pKw(T, rho) = -(a + b/T + c/T2 + d/T3 + (e + f/T + g/T2) log10(rho)), with T in K and rho in g/cm3. RHO298: the density of water at 298.15 K, g/cm3. zzH2O: the term of water in the model, a number. pK298, A and B belong to each reaction."
    reference: "Marshall W.L., Franck E.U. (1981) J. Phys. Chem. Ref. Data 10, 295-304 (a to g, the ionization of water); Borisov M.V., Shvarov Yu.V. (1992); Shvarov Yu.V., Bastrakov E.N. (1999) AGSO Record 1999/25 (the model, zzH2O = 1.0107); both as written in Dolejs D. (2013) Rev. Mineral. Geochem. 76, 35-79, Eqs. 43-44"
    parameters:
      a: -4.098
      b: -3245.2
      c: 2.2362e+5
      d: -3.984e+7
      e: 13.957
      f: -1262.3
      g: 8.5641e+5
      RHO298: 0.997061
      zzH2O: 1.0107
