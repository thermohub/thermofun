parameter_sets:
  WaterSaturation_constants_v1:
    method: WaterSaturation
    formula_units: {T: K, P: Pa, rho: kg/m3, M: kg/mol}
    description: "Values that the Reaktoro implementations of HGK and IAPWS-95 share. Saturation of water: sat_a1 to sat_a6 for the pressure, sat_b1 to sat_b6 for the density of the liquid, sat_c1 to sat_c6 for the density of the vapour; numbers without units. Tcr in K, Pcr in Pa, Dcr in kg/m3: the critical point. M in kg/mol: the molar mass of water. A pressure of 0 means the saturation pressure at T. The code of GEMS has its own saturation equation (psat_a in WaterHGK84-gems.yaml)."
    reference: "Wagner W., Pruss A. (1993) J. Phys. Chem. Ref. Data 22, 783-787; Wagner W., Pruss A. (2002) J. Phys. Chem. Ref. Data 31, 387-535"
