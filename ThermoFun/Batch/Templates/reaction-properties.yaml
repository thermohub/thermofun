# log K, dG, dH, dS and dCp of reactions.
conditions:
  T: {from: 25, to: 300, step: 25, unit: degC}
  P: {values: [saturation], unit: bar}
results:
  - name: reactions
    reactions: []
    properties:
      - {name: logK, digits: 3}
      - {name: dG, unit: kJ/mol, digits: 3}
      - {name: dH, unit: kJ/mol, digits: 3}
      - {name: dS, unit: J/K/mol, digits: 2}
      - {name: dCp, unit: J/K/mol, digits: 2}
    output: {file: reactions.csv}
