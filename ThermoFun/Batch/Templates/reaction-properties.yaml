# log K, dG, dH, dS and dCp of reactions.
conditions:
  T: {from: 25, to: 300, step: 25, unit: degC}
  P: {values: [saturation], unit: bar}
tables:
  - name: reactions
    reactions: []
    columns:
      - {property: logK, digits: 3}
      - {property: dG, unit: kJ/mol, digits: 3}
      - {property: dH, unit: kJ/mol, digits: 3}
      - {property: dS, unit: J/K/mol, digits: 2}
      - {property: dCp, unit: J/K/mol, digits: 2}
    output: reactions.csv
