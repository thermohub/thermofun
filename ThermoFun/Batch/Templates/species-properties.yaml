# G, H, S, Cp and V of substances, in the units of most papers.
conditions:
  T: {from: 25, to: 300, step: 25, unit: degC}
  P: {values: [saturation], unit: bar}
tables:
  - name: species
    records: []
    columns:
      - {property: G, unit: kJ/mol, digits: 3}
      - {property: H, unit: kJ/mol, digits: 3}
      - {property: S, unit: J/K/mol, digits: 2}
      - {property: Cp, unit: J/K/mol, digits: 2}
      - {property: V, unit: J/bar, digits: 4}
    output: species.csv
