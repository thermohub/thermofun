# G, H, S, Cp and V of substances, in the units of most papers.
conditions:
  T: {from: 25, to: 300, step: 25, unit: degC}
  P: {values: [saturation], unit: bar}
results:
  - name: species
    substances: []
    properties:
      - {name: G, unit: kJ/mol, digits: 3}
      - {name: H, unit: kJ/mol, digits: 3}
      - {name: S, unit: J/K/mol, digits: 2}
      - {name: Cp, unit: J/K/mol, digits: 2}
      - {name: V, unit: J/bar, digits: 4}
    output: {file: species.csv}
