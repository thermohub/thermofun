# The same substances from two databases, and their difference. Give the second database in `compare`.
conditions:
  T: {from: 25, to: 300, step: 25, unit: degC}
  P: {values: [saturation], unit: bar}
results:
  - name: databases
    substances: []
    properties:
      - {name: G, unit: kJ/mol, digits: 3}
    compare:
      - {label: first}
      - {label: second, database: <path of the second database>}
    compare_difference: true
    output: {file: databases.csv}
