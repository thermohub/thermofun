# The density and dielectric constant of water, with the Born functions.
conditions:
  T: {from: 25, to: 300, step: 25, unit: degC}
  P: {values: [saturation], unit: bar}
tables:
  - name: water
    records: [H2O@]
    columns:
      - {property: density, digits: 3}
      - {property: Alpha, format: scientific}
      - {property: Beta, format: scientific}
      - {property: epsilon, digits: 3}
      - {property: bornZ, format: scientific}
      - {property: bornY, format: scientific}
      - {property: bornQ, format: scientific}
      - {property: bornX, format: scientific}
    output: water.csv
