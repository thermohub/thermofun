# The density and dielectric constant of water, with the Born functions.
conditions:
  T: {from: 25, to: 300, step: 25, unit: degC}
  P: {values: [saturation], unit: bar}
results:
  - name: water
    substances: [H2O@]
    properties:
      - {name: density, digits: 3}
      - {name: Alpha, number_format: scientific}
      - {name: Beta, number_format: scientific}
      - {name: epsilon, digits: 3}
      - {name: bornZ, number_format: scientific}
      - {name: bornY, number_format: scientific}
      - {name: bornQ, number_format: scientific}
      - {name: bornX, number_format: scientific}
    output: {file: water.csv}
