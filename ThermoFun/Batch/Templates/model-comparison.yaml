# One column for each dielectric model of water, and their difference. Change `compare` for other models.
conditions:
  T: {from: 25, to: 300, step: 25, unit: degC}
  P: {values: [1000], unit: bar}
results:
  - name: comparison
    substances: []
    properties:
      - {name: V, unit: J/bar, digits: 4}
      - {name: Cp, unit: J/K/mol, digits: 2}
    compare:
      - {label: JN91}
      - {label: HK74, replace: {H2O@: {JohnsonNorton91: HelgesonKirkham74}}}
    compare_difference: true
    output: {file: comparison.csv}
