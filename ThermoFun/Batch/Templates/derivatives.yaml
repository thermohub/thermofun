# G with its derivatives by T and P, for substances.
conditions:
  T: {from: 25, to: 300, step: 25, unit: degC}
  P: {values: [1, 1000], unit: bar}
tables:
  - name: derivatives
    records: []
    columns:
      - {property: G}
      - {property: G, show: ddt}
      - {property: G, show: ddp}
    output: derivatives.csv
